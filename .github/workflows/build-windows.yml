name: Build Windows exe

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained exe
        run: >
          dotnet publish src/SubtitleCompare.App/SubtitleCompare.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish

      - name: Write version.txt
        shell: pwsh
        run: |
          $v = (Select-Xml -Path src/SubtitleCompare.App/SubtitleCompare.App.csproj -XPath "//Version").Node.InnerText
          Set-Content -Path publish/version.txt -Value $v.Trim() -NoNewline

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path publish/SubtitleCompare.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path publish/SubtitleCompare.exe.sha256 -Value "$hash  SubtitleCompare.exe" -NoNewline
          Copy-Item -Path scripts/Install-SubtitleCompare.ps1 -Destination publish/Install-SubtitleCompare.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SubtitleCompare
          path: |
            publish/SubtitleCompare.exe
            publish/SubtitleCompare.exe.sha256
            publish/Install-SubtitleCompare.ps1
            publish/version.txt

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SubtitleCompare
          path: ./release

      - name: Update Latest release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest
          name: Latest
          body: |
            Self-contained Windows build of Subtitle Compare.
            Download `SubtitleCompare.exe` and keep ffmpeg on PATH.
            This file is replaced on every push to main.
          files: |
            release/SubtitleCompare.exe
            release/SubtitleCompare.exe.sha256
            release/Install-SubtitleCompare.ps1
            release/version.txt
          make_latest: true
