name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained exe
        run: >
          dotnet publish src/SubtitleCompare.App/SubtitleCompare.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleCompare
          path: publish/SubtitleCompare.exe

      - name: Update Latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest
          body: |
            Self-contained Windows build of Subtitle Compare.
            Download `SubtitleCompare.exe` and keep ffmpeg on PATH.
            This file is replaced on every push to main.
          files: publish/SubtitleCompare.exe
          make_latest: true
